name: Pages

# The landing page at https://kaitila.github.io/intuition/, built from site/ (and the design tokens in
# src/web/) by scripts/build-site.ts into dist-site/. Pages must be switched on for the repository with
# source "GitHub Actions"; until then the deploy step fails.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - src/web/**
      - scripts/build-site.ts
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The page's own task writes the build script; until it lands there is nothing to deploy.
      - id: script
        run: |
          if [ -f scripts/build-site.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::scripts/build-site.ts does not exist yet: nothing to build or deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.script.outputs.present == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - if: steps.script.outputs.present == 'true'
        run: bun install --frozen-lockfile
      - if: steps.script.outputs.present == 'true'
        run: bun scripts/build-site.ts
      - if: steps.script.outputs.present == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-site
      - if: steps.script.outputs.present == 'true'
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
