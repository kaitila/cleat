name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      # The same command agents and people run locally.
      - run: bun run check

  # The macos layout: the unit tests on a Mac, then the shell installed natively (Electron for darwin, under
  # ~/Library/Application Support/intuition) and its self-test. The runner's desktop is a logged-in session,
  # but nobody can grant Screen Recording there: the self-test names what it skips for that.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      # Electron's installer needs Node 22.12 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      # CI is unset for this one command: the self-test skips itself under CI, for the jobs without a desktop.
      - run: env -u CI bun src/shell/selftest-run.ts

  # The linux layout's self-test on a virtual X display (Xvfb): no compositor, so the dock is the opaque one,
  # and no tray host. Ubuntu's runners stop unprivileged user namespaces, which Chromium's sandbox needs.
  linux-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 libnotify4
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" dbus-run-session -- env -u CI bun src/shell/selftest-run.ts
