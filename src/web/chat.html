<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/assets/theme.js"></script>
  <title>intuition</title>
  <link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/chat.css">
  <script type="module" src="/assets/chat.js"></script>
</head>
<body class="backdrop">
  <div class="app">
    <nav class="sidebar glass" aria-label="Sessions">
      <div class="sidebar-head">
        <span class="brand"><svg class="mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="16.5" cy="10" r="4.5"/><rect x="2" y="16.5" width="20" height="4" rx="2"/></svg>intuition</span>
        <span class="sidebar-actions">
          <a class="new-task button quiet" href="/prompt">New task</a>
          <a class="settings-link button quiet" href="/assets/settings.html" aria-label="Settings" title="Settings"><svg class="gear" viewBox="0 0 16 16" stroke="currentColor" aria-hidden="true"><path d="M12.98 6.91L14.64 6.81L14.64 9.19L12.98 9.09L12.3 10.75L13.54 11.86L11.86 13.54L10.75 12.3L9.09 12.98L9.19 14.64L6.81 14.64L6.91 12.98L5.25 12.3L4.14 13.54L2.46 11.86L3.7 10.75L3.02 9.09L1.36 9.19L1.36 6.81L3.02 6.91L3.7 5.25L2.46 4.14L4.14 2.46L5.25 3.7L6.91 3.02L6.81 1.36L9.19 1.36L9.09 3.02L10.75 3.7L11.86 2.46L13.54 4.14L12.3 5.25Z"/><circle cx="8" cy="8" r="2.25"/></svg></a>
        </span>
      </div>
      <div class="finder">
        <input id="search" class="input search" type="search" placeholder="Search" aria-label="Search sessions by title or workspace" autocomplete="off">
        <div class="filters">
          <select id="workspace-filter" class="select quiet small filter" aria-label="Workspace">
            <button><selectedcontent></selectedcontent></button>
            <option value="">All workspaces</option>
          </select>
          <button id="archived-view" class="quiet small" type="button" aria-pressed="false">Archived</button>
        </div>
      </div>
      <p id="sessions-empty" class="sessions-empty muted small" hidden>No sessions yet.</p>
      <ul id="sessions" class="sessions"></ul>
      <p id="undo" class="undo small" role="status" hidden></p>
      <p id="connection" class="connection muted small" role="status" hidden></p>
    </nav>
    <main class="main glass">
      <header id="head" class="head" hidden>
        <h1 id="title" class="title"></h1>
        <p id="meta" class="meta muted small">
          <span id="dot" class="dot"></span>
          <span id="workspace"></span>
          <span id="agent" class="agent"></span>
          <span id="status"></span>
          <button id="stop" class="stop small" type="button" hidden>Stop</button>
        </p>
      </header>
      <div id="scroller" class="scroller">
        <div id="stream" class="stream" role="log" aria-label="Session"></div>
        <div id="empty" class="empty" hidden>
          <p class="strong">Nothing here yet.</p>
          <p class="muted small">Start a session with <a href="/prompt">New task</a>.</p>
        </div>
      </div>
      <form id="reply" class="reply" hidden>
        <textarea id="reply-text" class="input" rows="1" placeholder="Reply" aria-label="Reply" aria-describedby="reply-hint" disabled></textarea>
        <p id="reply-hint" class="reply-hint muted small" role="status"></p>
      </form>
    </main>
  </div>
  <dialog id="confirm" class="confirm glass-float" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <form method="dialog" class="confirm-form">
      <h2 id="confirm-title" class="title"></h2>
      <p id="confirm-body" class="muted"></p>
      <div class="confirm-actions">
        <button value="cancel" class="quiet">Cancel</button>
        <button id="confirm-ok" value="ok" class="danger"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
