<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>intuition</title>
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/chat.css">
  <script type="module" src="/assets/chat.js"></script>
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="Sessions">
      <div class="sidebar-head">
        <span class="brand">intuition</span>
        <a class="new-task button quiet" href="/prompt">New task</a>
      </div>
      <div class="finder">
        <input id="search" class="input search" type="search" placeholder="Search" aria-label="Search sessions by title or workspace" autocomplete="off">
        <div class="filters">
          <select id="workspace-filter" class="filter small" aria-label="Workspace">
            <option value="">All workspaces</option>
          </select>
          <button id="archived-view" class="quiet small" type="button" aria-pressed="false">Archived</button>
        </div>
      </div>
      <p id="sessions-empty" class="sessions-empty muted small" hidden>No sessions yet.</p>
      <ul id="sessions" class="sessions"></ul>
      <p id="undo" class="undo small" role="status" hidden></p>
      <p id="connection" class="connection muted small" role="status" hidden></p>
    </nav>
    <main class="main">
      <header id="head" class="head" hidden>
        <h1 id="title" class="title"></h1>
        <p id="meta" class="meta muted small">
          <span id="dot" class="dot"></span>
          <span id="workspace"></span>
          <span id="status"></span>
          <button id="stop" class="stop small" type="button" hidden>Stop</button>
        </p>
      </header>
      <div id="scroller" class="scroller">
        <div id="stream" class="stream" role="log" aria-label="Session"></div>
        <div id="empty" class="empty" hidden>
          <p class="strong">Nothing here yet.</p>
          <p class="muted small">Start a session with <a href="/prompt">New task</a>.</p>
        </div>
      </div>
      <form id="reply" class="reply" hidden>
        <textarea id="reply-text" class="input" rows="1" placeholder="Reply" aria-label="Reply" aria-describedby="reply-hint" disabled></textarea>
        <p id="reply-hint" class="reply-hint muted small" role="status"></p>
      </form>
    </main>
  </div>
  <dialog id="confirm" class="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <form method="dialog" class="confirm-form">
      <h2 id="confirm-title" class="title"></h2>
      <p id="confirm-body" class="muted"></p>
      <div class="confirm-actions">
        <button value="cancel" class="quiet">Cancel</button>
        <button id="confirm-ok" value="ok" class="danger"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
