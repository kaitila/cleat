<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/assets/theme.js"></script>
  <title>intuition dock</title>
  <link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/dock.css">
  <script type="module" src="/assets/dock.js"></script>
</head>
<body class="dark">
  <!-- The island is as large as the window and never changes size: what is seen of it is its clip. -->
  <main id="island" class="island" data-state="idle" data-tone="none">
    <div class="surface">
    <div id="pill" class="pill layer small" role="status" data-tone="none">
      <span id="pill-dot" class="dot"></span>
      <span id="pill-text" class="pill-text" hidden>intuition</span>
      <span id="pill-failed" class="dot" data-status="error" title="The last one failed" hidden></span>
    </div>

    <div id="peek" class="peek layer" role="status" hidden>
      <span id="peek-dot" class="dot"></span>
      <span id="peek-title" class="peek-title strong"></span>
      <span id="peek-body" class="peek-body muted small"></span>
      <span id="peek-label" class="peek-label small"></span>
    </div>

    <section id="panel" class="panel layer" aria-label="Sessions" hidden>
      <!-- The head: the session shown, which is also the switch to the others; the other sessions at
           work, a dot each; what applies to the one shown now; its "…"; and New task. The switch opens
           under it only when asked for (a click, or ⌘K). -->
      <header class="panel-head">
        <button id="switcher" class="switcher quiet" type="button" aria-expanded="false" aria-controls="sessions-list" title="Switch session (⌘K)">
          <span id="switcher-dot" class="dot"></span>
          <span id="title" class="switcher-title"></span>
          <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" /></svg>
        </button>
        <span id="live" class="live" role="group" aria-label="Other sessions at work" hidden></span>
        <span id="connection" class="connection muted small" role="status" hidden>reconnecting</span>
        <button id="more" class="more quiet small" type="button" aria-label="More" aria-haspopup="menu" title="More">…</button>
        <a class="button quiet small new-task" href="/prompt" target="_blank" rel="noopener">New task</a>
        <!-- The chat, the island grown large (D0042): as a click on the notch's band or the head does. -->
        <button id="expand" class="expand quiet small" type="button" aria-label="Open the chat" title="Open the chat"><svg class="expand-mark" viewBox="0 0 16 16" stroke="currentColor" aria-hidden="true"><path d="M10 2.5h3.5V6M13.5 2.5 9 7M6 13.5H2.5V10M2.5 13.5 7 9" /></svg></button>
      </header>
      <div id="sessions-list" class="sessions-list" hidden>
        <div class="sessions-top">
          <input id="find" class="input find small" type="search" placeholder="Find a session" aria-label="Find a session by title or workspace" aria-controls="sessions" autocomplete="off" spellcheck="false">
          <select id="workspace" class="select quiet small workspace" aria-label="Workspace">
            <button><selectedcontent></selectedcontent></button>
            <option value="">All workspaces</option>
          </select>
        </div>
        <ul id="sessions" class="sessions"></ul>
      </div>
      <p id="sessions-empty" class="empty muted small" hidden>No sessions yet. Start one with New task.</p>
      <div id="session" class="session" hidden>
        <div id="scroller" class="scroller">
          <div id="stream" class="stream" role="log" aria-label="Session"></div>
        </div>
        <form id="reply" class="reply">
          <textarea id="reply-text" class="input" rows="1" placeholder="Reply" aria-label="Reply" aria-describedby="reply-hint" disabled></textarea>
          <p id="reply-hint" class="reply-hint muted small" role="status" hidden></p>
        </form>
      </div>
    </section>

    <!-- The chat (D0042): the chat view itself, /?embed=dock, loaded once and kept, laid out at its
         full size while hidden, so growing into it draws what is already there. dock.js sets its src. -->
    <section id="chat" class="chat layer" aria-label="Chat" data-off inert>
      <iframe id="chat-frame" class="chat-frame" title="Chat"></iframe>
    </section>
    </div>
  </main>
</body>
</html>
