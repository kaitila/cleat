<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/assets/theme.js"></script>
  <title>intuition dock</title>
  <link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/dock.css">
  <script type="module" src="/assets/dock.js"></script>
</head>
<body class="dark">
  <!-- The island is as large as the window and never changes size: what is seen of it is its clip. -->
  <main id="island" class="island" data-state="idle" data-tone="none">
    <div class="surface">
    <div id="pill" class="pill layer small" role="status" data-tone="none">
      <span id="pill-dot" class="dot"></span>
      <span id="pill-text" class="pill-text" hidden>intuition</span>
      <span id="pill-failed" class="dot" data-status="error" title="The last one failed" hidden></span>
    </div>

    <div id="peek" class="peek layer" role="status" hidden>
      <span id="peek-dot" class="dot"></span>
      <span id="peek-title" class="peek-title strong"></span>
      <span id="peek-body" class="peek-body muted small"></span>
      <span id="peek-label" class="peek-label small"></span>
    </div>

    <section id="panel" class="panel layer" aria-label="Sessions" hidden>
      <header class="panel-head">
        <select id="workspace" class="select quiet small workspace" aria-label="Workspace">
          <button><selectedcontent></selectedcontent></button>
          <option value="">All workspaces</option>
        </select>
        <span id="connection" class="connection muted small" role="status" hidden>reconnecting</span>
        <a class="button quiet small new-task" href="/prompt" target="_blank" rel="noopener">New task</a>
      </header>
      <ul id="sessions" class="sessions"></ul>
      <p id="sessions-empty" class="empty muted small" hidden>No sessions yet. Start one with New task.</p>
      <div id="session" class="session" hidden>
        <div class="session-head">
          <h1 id="title" class="session-title strong"></h1>
          <button id="more" class="more quiet small" type="button" aria-label="More" aria-haspopup="menu" title="More">…</button>
        </div>
        <div id="scroller" class="scroller">
          <div id="stream" class="stream" role="log" aria-label="Session"></div>
        </div>
        <form id="reply" class="reply">
          <textarea id="reply-text" class="input" rows="1" placeholder="Reply" aria-label="Reply" aria-describedby="reply-hint" disabled></textarea>
          <p id="reply-hint" class="reply-hint muted small" role="status" hidden></p>
        </form>
      </div>
    </section>
    </div>
  </main>
</body>
</html>
