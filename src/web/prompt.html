<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/assets/theme.js"></script>
  <title>Cleat</title>
  <link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/prompt.css">
  <script type="module" src="/assets/prompt.js"></script>
</head>
<body>
  <form id="prompt" class="prompt glass-float" autocomplete="off">
    <div class="pick">
      <div id="workspaces" class="workspaces" role="radiogroup" aria-label="Workspace"></div>
      <!-- The agent the task starts on: the workspace's own until flipped (a click, or Alt+A). -->
      <button id="agent" class="agent-switch quiet small" type="button" aria-keyshortcuts="Alt+A" hidden></button>
    </div>
    <!-- The task (composer.js, D0056): plain text, and what is pasted or dropped goes in at the caret,
         a long paste or a picture as a chip. Empty until typed into: its placeholder is drawn by prompt.css. -->
    <div id="task" class="task empty" role="textbox" aria-multiline="true" aria-label="Task" data-placeholder="What should Claude do?" spellcheck="false" tabindex="0"></div>
    <footer class="foot small">
      <span id="status" class="status" role="status" aria-live="polite"></span>
      <!-- The hint line: shortcuts.js's HINTS.prompt, in this platform's words. -->
      <span id="keys" class="keys muted" aria-hidden="true"></span>
    </footer>
  </form>
</body>
</html>
