<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/assets/theme.js"></script>
  <title>intuition</title>
  <link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/prompt.css">
  <script type="module" src="/assets/prompt.js"></script>
</head>
<body>
  <form id="prompt" class="prompt glass-float" autocomplete="off">
    <div class="pick">
      <div id="workspaces" class="workspaces" role="radiogroup" aria-label="Workspace"></div>
      <!-- The agent the task starts on: the workspace's own until flipped (a click, or Alt+A). -->
      <button id="agent" class="agent-switch quiet small" type="button" aria-keyshortcuts="Alt+A" hidden></button>
    </div>
    <textarea id="task" class="task" aria-label="Task" placeholder="What should Claude do?" spellcheck="false" autofocus></textarea>
    <!-- The clipboard attachment. Empty and hidden until prompt.js finds a fresh capture. -->
    <div id="clipboard" class="clipboard card" hidden></div>
    <footer class="foot small">
      <span id="status" class="status" role="status" aria-live="polite"></span>
      <span class="keys muted" aria-hidden="true"><kbd>Enter</kbd><span>start</span><kbd>Shift</kbd><kbd>Enter</kbd><span>new line</span><kbd>Alt</kbd><kbd>A</kbd><span>agent</span><kbd>Esc</kbd><span>close</span></span>
    </footer>
  </form>
</body>
</html>
